[package]
name = "madora-cli"
version = "0.1.0"
description = "Madora CLI — AI-powered terminal completion for Markdown"
authors = ["ichiyo"]
edition = "2021"

[[bin]]
name = "mado"
path = "src/main.rs"

[dependencies]
madora = { path = ".." }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
keyring-core = "1"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
similar = "2"
futures-util = "0.3"
