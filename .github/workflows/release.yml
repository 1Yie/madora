name: Release CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            fuse

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vcpkg = if (Test-Path 'C:\vcpkg\vcpkg.exe') { 'C:\vcpkg\vcpkg.exe' } else { 'vcpkg' }
          & $vcpkg integrate install
          & $vcpkg install openssl:x64-windows-static-md

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Create .env file (Unix)
        if: matrix.platform != 'windows-latest'
        run: printf '%s' "$ENV_FILE_CONTENT" > .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Create .env file (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          $env:ENV_FILE_CONTENT | Out-File -FilePath .env -Encoding utf8 -NoNewline
        shell: pwsh
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Build CLI binary (macOS universal)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cargo build -p madora-cli --release --target aarch64-apple-darwin
          cargo build -p madora-cli --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/mado \
            target/x86_64-apple-darwin/release/mado \
            -output target/release/mado
        working-directory: ./src-tauri

      - name: Build CLI binary (Linux / Windows)
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: cargo build -p madora-cli --release
        working-directory: ./src-tauri

      - name: Create platform-agnostic binary path (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: cp src-tauri/target/release/mado.exe src-tauri/target/release/mado

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Madora v__VERSION__"
          releaseBody: ${{ format('See {0}/blob/main/CHANGELOG.md for the full changelog.', format('{0}/{1}', github.server_url, github.repository)) }}
          releaseDraft: true
          prerelease: false

      - name: Upload CLI binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          EXT="${{ matrix.platform == 'windows-latest' && '.exe' || '' }}"
          case "${{ matrix.platform }}" in
            macos-latest)   PLATFORM="aarch64-apple-darwin"  ;;
            ubuntu-22.04)   PLATFORM="x86_64-unknown-linux-gnu" ;;
            windows-latest) PLATFORM="x86_64-pc-windows-msvc" ;;
          esac
          BINARY="src-tauri/target/release/mado${EXT}"
          ASSET="mado-${PLATFORM}${EXT}"
          gh release upload "$TAG" "${BINARY}#${ASSET}" --clobber
