name: Release CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: madora-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release metadata
        id: metadata
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const desktopVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const mobileVersion = JSON.parse(fs.readFileSync('app/package.json', 'utf8')).version;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=v${desktopVersion}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_name=Madora Desktop ${desktopVersion} | Mobile ${mobileVersion}\n`, 'utf8');
          EOF

      - name: Create GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ format('See {0}/blob/main/CHANGELOG.md for the full changelog.', format('{0}/{1}', github.server_url, github.repository)) }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: node scripts/ensure-github-release.js

  publish:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vcpkg = if (Test-Path 'C:\vcpkg\vcpkg.exe') { 'C:\vcpkg\vcpkg.exe' } else { 'vcpkg' }
          & $vcpkg integrate install
          & $vcpkg install openssl:x64-windows-static-md

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Create .env file (Unix)
        if: matrix.platform != 'windows-latest'
        run: printf '%s' "$ENV_FILE_CONTENT" > .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Create .env file (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          $env:ENV_FILE_CONTENT | Out-File -FilePath .env -Encoding utf8 -NoNewline
        shell: pwsh
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseBody: ${{ format('See {0}/blob/main/CHANGELOG.md for the full changelog.', format('{0}/{1}', github.server_url, github.repository)) }}
          releaseDraft: true
          prerelease: false

      # ----------------------------------------------------------------
      # Portable Linux tarball (.tar.gz)
      #   - Extracted from the .deb built above, which already lays
      #     files out under /usr (bin + share + icons).
      #   - Built on ubuntu-22.04 so the glibc baseline is 2.35, the
      #     oldest GitHub runner currently offers. Any distro with
      #     glibc >= 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+,
      #     Arch, openSUSE Leap 15.5, etc.) can run it.
      # ----------------------------------------------------------------
      - name: Build portable Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -eu
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          mkdir -p extract
          dpkg-deb -x "$DEB" extract
          tar -czf "madora-${VERSION}-linux-x86_64.tar.gz" -C extract .

      - name: Upload portable Linux tarball to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: node scripts/upload-github-release-assets.js madora-*-linux-x86_64.tar.gz
