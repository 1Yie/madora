name: Release CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — split into two runners so each builds natively for
          # its own architecture. Keeps artifacts small (no universal binary).
          - platform: macos-14
            arch: aarch64
          - platform: macos-13
            arch: x86_64
          # Linux — x86_64 on ubuntu-22.04 (glibc 2.35 baseline).
          - platform: ubuntu-22.04
            arch: x86_64
          # Linux ARM64 — native runner, glibc 2.35 baseline. Covers
          # Raspberry Pi 5, Ampere ARM workstations, ARM cloud VMs.
          - platform: ubuntu-22.04-arm
            arch: aarch64
          # Windows x86_64
          - platform: windows-latest
            arch: x86_64
          # Windows ARM64 — experimental. vcpkg + OpenSSL static builds
          # for aarch64 are flaky, so a failure here must NOT block the
          # rest of the release. See continue-on-error on the build step.
          - platform: windows-11-arm
            arch: aarch64

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.platform == 'windows-11-arm' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install OpenSSL (Windows x86_64 only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vcpkg = if (Test-Path 'C:\vcpkg\vcpkg.exe') { 'C:\vcpkg\vcpkg.exe' } else { 'vcpkg' }
          & $vcpkg integrate install
          & $vcpkg install openssl:x64-windows-static-md

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Create .env file (Unix)
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Create .env file (Windows)
        if: startsWith(matrix.platform, 'windows')
        run: |
          $env:ENV_FILE_CONTENT | Out-File -FilePath .env -Encoding utf8 -NoNewline
        shell: pwsh
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Madora v__VERSION__'
          releaseBody: ${{ format('See {0}/blob/main/CHANGELOG.md for the full changelog.', format('{0}/{1}', github.server_url, github.repository)) }}
          releaseDraft: true
          prerelease: false

      # ----------------------------------------------------------------
      # Portable Linux tarball (.tar.gz)
      #   - Extracted from the .deb built above, which already lays
      #     files out under /usr (bin + share + icons).
      #   - Built on ubuntu-22.04 so the glibc baseline is 2.35, the
      #     oldest GitHub runner currently offers. Any distro with
      #     glibc >= 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+,
      #     Arch, openSUSE Leap 15.5, etc.) can run it.
      # ----------------------------------------------------------------
      - name: Build portable Linux tarball
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          set -eu
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          mkdir -p extract
          dpkg-deb -x "$DEB" extract
          tar -czf "madora-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C extract .
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Upload portable Linux tarball to release
        if: startsWith(matrix.platform, 'ubuntu')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: madora-*-linux-*.tar.gz
          draft: true
          prerelease: false
