name: App Release CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: EAS build platform
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: preview
        options:
          - preview
          - preview-device
          - production

jobs:
  eas-build:
    name: EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Run app tests
        run: bun run test

      - name: Build app
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive
